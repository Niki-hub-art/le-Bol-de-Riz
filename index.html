<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Le Bol de Riz — Cuisine vietnamienne &amp; chinoise, Bruxelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FDFBFA;
    --cream-soft: rgba(253,251,250,0.86);
    --charcoal: #2B2A26;
    --bamboo: #156b0e;
    --bamboo-deep: #0e4c0a;
    --line: rgba(43,42,38,0.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    overflow:hidden;
    background:var(--cream);
    font-family:'Work Sans', sans-serif;
    color:var(--charcoal);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body{
    position:relative;
    height:100vh;
    height:100dvh;
    width:100vw;
  }

  /* ---------- BACKGROUND VIDEO ---------- */
  .hero-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: right center;
    z-index:0;
  }

  @media (prefers-reduced-motion: reduce){
    .hero-video{ display:none; }
    .hero-video-fallback{ display:block; }
  }

  .hero-video-fallback{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: right center;
    z-index:0;
  }

  .hero-scrim{
    position:fixed;
    inset:0;
    background: linear-gradient(
      100deg,
      var(--cream) 0%,
      var(--cream-soft) 28%,
      rgba(253,251,250,0.35) 46%,
      rgba(253,251,250,0) 62%
    );
    z-index:1;
  }

  /* ---------- REPLAY-KNOP — enkel zichtbaar nadat de video is
       uitgespeeld. Linksboven, subtiel, zelfde stijl als de
       andere ronde knopjes op de site. ---------- */
  .replay-btn{
    position:fixed;
    top: 50%;
    left: 78%;
    right: auto;
    transform: translate(-50%, -50%);
    z-index:3;
    width:42px;
    height:42px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(253,251,250,0.18);
    color: var(--bamboo-deep);
    box-shadow: 0 4px 12px -6px rgba(43,42,38,0.25);
    cursor:pointer;
    border:none;
    padding:0;
    transition: box-shadow .25s ease, background .25s ease;
  }

  .replay-btn:hover{
    background: rgba(253,251,250,0.55);
    box-shadow: 0 8px 18px -6px rgba(43,42,38,0.35);
  }

  .replay-btn svg{
    width:20px;
    height:20px;
    display:block;
    margin:0 auto;
  }

  /* ---------- SITE HEADER: taalwissel op een compact, beige
       zwevend rechthoekje, los van de schermrand, halfdoorschijnend
       beige. ---------- */
  .site-header{
    position:fixed;
    top: 1.6rem;
    right: 6vw;
    z-index:3;
    background: rgba(253,251,250,0.72);
    padding: 0.45rem 1.1rem 0.5rem;
    border-radius: 10px;
    box-shadow: 0 6px 14px -8px rgba(43,42,38,0.3);
    backdrop-filter: blur(3px);
  }

  .lang-switch{
    display:flex;
    align-items:center;
    gap:0.6rem;
    font-family:'Work Sans', sans-serif;
    font-size:1rem;
    letter-spacing:0.06em;
    font-weight:600;
    color: var(--charcoal);
  }

  .lang-switch button{
    background:none;
    border:none;
    padding:4px 2px;
    cursor:pointer;
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    border-bottom: 1px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }

  .lang-switch button.active{
    color: var(--charcoal);
    border-bottom-color: var(--bamboo-deep);
  }

  .lang-switch button:hover{ color: var(--charcoal); }

  .lang-switch .sep{ opacity:0.5; }

  /* ---------- CONTENT ---------- */
  .hero-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap: 1.25rem;
    max-width: 46ch;
    padding: 2.9rem 6vw;
  }

  .logo-o{
    display:inline-block;
    width: 1.9em;
    height: 1.9em;
    object-fit:contain;
    vertical-align: -0.5em;
    margin: 0 -0.3em;
  }

  /* Titel — nu in dezelfde sans-serif stijl als het FB/IG-profiel
     (Avenir-achtig), volledig zwart, geen aparte kleur/cursief meer
     voor "de Riz". */
  h1{
    font-family:'Work Sans', sans-serif;
    font-weight:400;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    line-height:0.3;
    letter-spacing:-0.01em;
    color: var(--charcoal);
  }

  h1 em{
    font-style:normal;
    font-weight:400;
    color: var(--charcoal);
  }

  .tagline{
    font-size: 1.15rem;
    line-height:1.5;
    color: var(--charcoal);
    font-weight:500;
    max-width: 34ch;
    margin-top: 0.9rem;
  }

  /* ---------- INFO BLOCK — iconen i.p.v. tekstlabels ---------- */
  .info-list{
    display:flex;
    flex-direction:column;
    gap:0.6rem;
    margin-top: 0.4rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
  }

  .info-row{
    display:flex;
    align-items:flex-start;
    gap:0.85rem;
    font-size:0.9rem;
    color: var(--charcoal);
    font-weight:400;
    line-height:1.45;
  }

  .info-row svg{
    width:18px;
    height:18px;
    flex-shrink:0;
    margin-top:2px;
    stroke: var(--bamboo-deep);
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .tel-link{
    color: inherit;
    text-decoration: none;
  }

  .sheet-handle{
    display:none;
  }

  /* ---------- CTA (rechthoekig, donkergroen) ---------- */
  .cta{
    align-self:flex-start;
    margin-top: 0.6rem;
    display:inline-flex;
    align-items:center;
    padding: 1rem 2.4rem;
    background: #0d4808;
    color: var(--cream);
    text-decoration:none;
    border:none;
    border-radius: 6px;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    letter-spacing:0.03em;
    cursor:pointer;
    box-shadow: 0 12px 30px -10px rgba(43,42,38,0.25);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .cta:hover{
    transform: translateY(-2px);
    background: #082e05;
    box-shadow: 0 16px 34px -10px rgba(43,42,38,0.35);
  }

  /* ---------- SOCIAL LINKS — echte merkkleuren, rechtsonder ---------- */
  .social-links{
    position:fixed;
    right: 2.8vw;
    bottom: 2.5rem;
    z-index:3;
    display:flex;
    align-items:center;
    gap:0.7rem;
  }

  .social-links a{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    box-shadow: 0 8px 20px -8px rgba(43,42,38,0.35);
    transition: transform .25s ease, box-shadow .25s ease;
  }

  .social-links a:hover{
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 24px -8px rgba(43,42,38,0.45);
  }

  .social-links svg{
    width:100%;
    height:100%;
    display:block;
  }

  @media (max-height: 620px){
    .social-links{ bottom: 0.7rem; }
    .social-links a{ width:36px; height:36px; }
  }

  @media (max-width: 760px){
    /* Op mobiel: taalwissel rechtsboven, social-icons er net onder
       (zelfde kant, gestapeld i.p.v. tegenover elkaar). */
    .social-links{ top: 3.3rem; right: 6vw; bottom: auto; }
  }

  /* ---------- RESPONSIVE (MOBIEL) ---------- */
  @media (max-width: 760px){

    /* Geen witte waas meer over de video — die blijft volledig
       helder zichtbaar. Enkel de kaart zelf (hieronder) heeft nog
       een eigen, opake achtergrond. */
    .hero-scrim{
      background: transparent;
    }

    /* Rechthoekje rond de taalwissel: compacter/dunner en hoger
       geplaatst dan voorheen, zodat het niet meer interfereert met
       de social-iconen eronder. */
    .site-header{
      top: 0.7rem;
      right: 6vw;
      background: rgba(253,251,250,0.72);
      padding: 0.22rem 0.7rem 0.25rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px -6px rgba(43,42,38,0.25);
      backdrop-filter: blur(3px);
    }
    .lang-switch{ color: var(--charcoal); }
    .lang-switch button.active{ color: var(--charcoal); border-bottom-color: var(--bamboo-deep); }
    .lang-switch button:hover{ color: var(--charcoal); }

    .replay-btn{ top: 1.2rem; left: 6vw; right: auto; transform: none; }
    .replay-btn:hover{ transform: translateY(-3px); }

    .hero-content{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:auto;
      max-height: 80vh;
      overflow-y: auto;
      justify-content:flex-start;
      gap: 0.9rem;
      padding: 0.7rem 7vw 2.2rem;
      max-width: 100%;
      background: var(--cream);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -12px 30px -10px rgba(43,42,38,0.18);
      transition: transform 0.3s ease;
      will-change: transform;
      /* Nodig zodat slepen vanaf de volledige kaart soepel werkt,
         zonder dat de browser het interpreteert als pagina-scroll. */
      touch-action: none;
    }

    .sheet-handle{
      display:block;
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(43,42,38,0.28);
      margin: 0 auto 0.9rem;
      touch-action: none;
      cursor: grab;
    }

    /* Titel op één horizontale regel i.p.v. twee gestapelde regels */
    h1{
      font-size: clamp(1.7rem, 7.5vw, 2.3rem);
      line-height:1;
      font-weight:500;
    }

    .title-break{ display:none; }

    h1 em{ margin-left: 0.2em; font-weight:500; }

    .tagline{ font-size: 1.05rem; margin-top: 0.6rem; }

    /* Info-tekst groter voor betere leesbaarheid (er is nu meer
       ruimte doordat de titel maar 1 regel meer inneemt) */
    .info-list{ gap: 0.65rem; padding-top: 0.9rem; }

    .info-row{ font-size: 1rem; }

    .info-row svg{ width:20px; height:20px; }

    .cta{
      padding: 0.9rem 2rem;
      margin-top: 0.3rem;
    }
  }

  @media (max-height: 620px) and (min-width: 761px){
    .site-header{ top: 1rem; }
    .replay-btn{ top: 1rem; }
    .hero-content{ gap: 0.9rem; padding: 1.9rem 6vw; }
    h1{ font-size: clamp(1.9rem, 8vw, 2.6rem); }
    .info-list{ padding-top:0.7rem; }
    .cta{ padding: 0.85rem 2rem; }
  }
</style>
</head>

  <script>
    const translations = {
      fr: {
        tagline: "Made with care.",
        hoursValue: "Lun–Ven · 12:00–14:30 &amp; 18:00–22:00<br>Dimanche sur RDV",
        cta: "Voir le menu"
      },
      en: {
        tagline: "Made with care.",
        hoursValue: "Mon–Fri · 12:00–14:30 &amp; 18:00–22:00<br>Sunday by appointment",
        cta: "View Menu"
      }
    };

    function applyLanguage(lang) {
      const dict = translations[lang];
      if (!dict) return;

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) {
          el.innerHTML = dict[key];
        }
      });

      document.documentElement.lang = lang;

      document.querySelectorAll('.lang-switch button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      localStorage.setItem('lbdz-lang', lang);
    }

    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
    });

    const savedLang = localStorage.getItem('lbdz-lang');
    if (savedLang && translations[savedLang]) {
      applyLanguage(savedLang);
    }

    // ============================================================
    // REPLAY-KNOP — verschijnt enkel nadat de video is uitgespeeld
    // (geen 'loop', dus stopt vanzelf). Klik → herstart de video en
    // verbergt de knop weer tot de volgende keer dat hij eindigt.
    // ============================================================
    (function () {
      const heroVideo = document.getElementById('heroVideo');
      const replayBtn = document.getElementById('replayBtn');
      if (!heroVideo || !replayBtn) return;

      heroVideo.addEventListener('ended', () => {
        replayBtn.style.display = 'flex';
      });

      replayBtn.addEventListener('click', () => {
        replayBtn.style.display = 'none';
        heroVideo.currentTime = 0;
        heroVideo.play();
      });
    })();

    // ============================================================
    // SWIPEABLE KAART (enkel mobiel) — VRIJ sleepbaar vanaf de
    // VOLLEDIGE kaart (niet enkel het dunne handvatje bovenaan).
    // Tikken/slepen op een link of knop (telefoonnummer, "Voir le
    // menu") wordt genegeerd door de sleep-logica, zodat die gewoon
    // normaal blijven werken. De kaart volgt exact je vinger, en
    // blijft precies staan waar je loslaat (geen snap-gedrag).
    // Grenzen: kan nooit volledig verdwijnen (blijft altijd een
    // stukje zichtbaar onderaan) en kan nooit het hele scherm tot
    // bovenaan innemen (blijft altijd ruimte voor de video vrij).
    // ============================================================
    (function () {
      const sheet = document.getElementById('heroContent');
      const handle = document.getElementById('sheetHandle');
      if (!sheet || !handle) return;

      function isMobile() {
        return window.matchMedia('(max-width: 760px)').matches;
      }

      let dragging = false;
      let startY = 0;
      let startOffset = 0;
      let offset = 0;       // huidige positie: 0 = volledig open, maxOffset = maximaal ingeklapt
      let maxOffset = 0;
      const peek = 110;     // px die altijd zichtbaar blijven, zelfs volledig "dicht" geschoven

      function computeMaxOffset() {
        maxOffset = Math.max(sheet.offsetHeight - peek, 0);
      }

      function applyOffset(animate) {
        sheet.style.transition = animate ? 'transform 0.3s ease' : 'none';
        sheet.style.transform = `translateY(${offset}px)`;
      }

      function onStart(e) {
        if (!isMobile()) return;
        // Als het aftikpunt op een link/knop zit (telefoonnummer,
        // "Voir le menu"), laat dat gewoon normaal werken — start
        // dan geen sleepbeweging.
        if (e.target.closest('a, button')) return;
        dragging = true;
        computeMaxOffset();
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startOffset = offset;
        sheet.style.transition = 'none';
      }

      function onMove(e) {
        if (!dragging) return;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const delta = currentY - startY;
        offset = Math.min(Math.max(startOffset + delta, 0), maxOffset);
        applyOffset(false);
      }

      function onEnd() {
        if (!dragging) return;
        dragging = false;
        applyOffset(true);
      }

      // Slepen kan vanaf de volledige kaart, niet enkel het handvatje.
      sheet.addEventListener('touchstart', onStart, { passive: true });
      sheet.addEventListener('touchmove', onMove, { passive: true });
      sheet.addEventListener('touchend', onEnd);
      sheet.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      window.addEventListener('resize', () => {
        if (!isMobile()) return;
        computeMaxOffset();
        offset = Math.min(offset, maxOffset);
        applyOffset(false);
      });
    })();
  </script>

</body>
</html>
